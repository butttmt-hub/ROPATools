function blankEntry(division) {
  const o = { _id: uid() };
  ALL_FIELDS.forEach(f => { o[f.key] = f.type === "checks" ? [] : ""; });
  o.division = division || "";
  return o;
}

    const a = document.createElement("a");
    a.href = url; a.download = name; a.rel = "noopener"; a.target = "_blank";
    document.body.appendChild(a); a.click(); a.remove();
  } catch (e) {}
  const w = window.open(url, "_blank");
  if (!w) alert("เบราว์เซอร์บล็อกการดาวน์โหลด — กรุณาอนุญาตป๊อปอัปสำหรับหน้านี้แล้วลองใหม่");
  setTimeout(() => URL.revokeObjectURL(url), 30000);
}

/* ---------- App state ---------- */
const App = {
  state: { entries: [], view: "register", mode: "wizard", currentId: null, step: 0, query: "", savedAt: null, guideOpen: false, confirmMsg: null, confirmAction: null, backupNudge: false },
  nudgeT: null,

  syncing: false, lastRemoteJson: null,

  normalize(entries) {
    if (!Array.isArray(entries) || !entries.length) entries = seed();
    else {
      const have = new Set(entries.map(en => en.ref));
      const missing = seed().filter(en => en.ref && en.ref.indexOf("TR-") === 0 && !have.has(en.ref));
      if (missing.length) entries = entries.concat(missing);
    }
    entries.forEach(en => { ALL_FIELDS.forEach(f => { if (en[f.key] == null) en[f.key] = f.type === "checks" ? [] : ""; }); if (!en._id) en._id = uid(); });
    return entries;
  },

  init() {
    let entries = null;
    try { const raw = localStorage.getItem(LS_KEY); if (raw) entries = JSON.parse(raw); } catch (e) {}
    entries = this.normalize(entries);
    this.state.entries = entries;
    try { localStorage.setItem(LS_KEY, JSON.stringify(entries)); } catch (e) {}
    this.render();
    this.fetchRemote(true);
    setInterval(() => this.fetchRemote(false), 8000);
  },

  fetchRemote(applyIfEmpty) {
    if (!SHEET_URL) return;
    fetch(SHEET_URL, { cache: "no-store" }).then(r => r.json()).then(data => {
      const json = JSON.stringify(data);
      if (json === this.lastRemoteJson) return;
      this.lastRemoteJson = json;
      if (this.state.view === "edit" && !applyIfEmpty) return; // avoid clobbering active editing mid-typing
      const entries = this.normalize(data);
      this.state.entries = entries;
      try { localStorage.setItem(LS_KEY, JSON.stringify(entries)); } catch (e) {}
      this.render();
    }).catch(() => {});
  },

  pushRemote(entries) {
    if (!SHEET_URL) return;
    const json = JSON.stringify(entries);
    this.lastRemoteJson = json;
    fetch(SHEET_URL, { method: "POST", body: json }).catch(() => {});
  },

  setState(patch) { Object.assign(this.state, patch); this.render(); },
  persist(entries) {
    try { localStorage.setItem(LS_KEY, JSON.stringify(entries)); } catch (e) {}
    this.setState({ entries, savedAt: new Date() });
    this.pushRemote(entries);
    this.queueBackupNudge();
  },
  queueBackupNudge() { clearTimeout(this.nudgeT); this.nudgeT = setTimeout(() => this.setState({ backupNudge: true }), 1500); },
  current() { return this.state.entries.find(e => e._id === this.state.currentId) || null; },
  setField(key, value) {
    const entries = this.state.entries.map(e => e._id === this.state.currentId ? Object.assign({}, e, { [key]: value }) : e);
    this.persist(entries);
  },
  completeness(en) {
    const req = ALL_FIELDS.filter(f => f.req);
    const done = req.filter(f => !isEmptyVal(en[f.key])).length;
    return Math.round(done / req.length * 100);
  },
  cellValue(en, key) { const v = en[key]; return Array.isArray(v) ? v.join("\n") : String(v == null ? "" : v); },

  exportXlsx() {
    const enc = new TextEncoder(), entries = this.state.entries, n = EXPORT_COLS.length;
    const row = (r, vals, s) => {
      let cells = "";
      vals.forEach((v, i) => { if (v != null && v !== "") cells += `<c r="${colLetter(i)}${r}" s="${s}" t="inlineStr"><is><t xml:space="preserve">${xmlEsc(v)}</t></is></c>`; });
      return `<row r="${r}">${cells}</row>`;
    };
    const rows = [row(1, EXPORT_COLS.map(c => c.g || ""), 1), row(2, EXPORT_COLS.map(c => c.h || ""), 1)];
    entries.forEach((en, i) => rows.push(row(i + 3, EXPORT_COLS.map(c => c.key ? this.cellValue(en, c.key) : ""), 2)));
    const sheet = `<?xml version="1.0" encoding="UTF-8" standalone="yes"?><worksheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main"><sheetViews><sheetView workbookViewId="0"><pane xSplit="3" ySplit="2" topLeftCell="D3" activePane="bottomRight" state="frozen"/></sheetView></sheetViews><cols><col min="1" max="${n}" width="28" customWidth="1"/></cols><sheetData>${rows.join("")}</sheetData></worksheet>`;
    const files = [
      { name: "[Content_Types].xml", data: enc.encode(`<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types"><Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/><Default Extension="xml" ContentType="application/xml"/><Override PartName="/xl/workbook.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.sheet.main+xml"/><Override PartName="/xl/worksheets/sheet1.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.worksheet+xml"/><Override PartName="/xl/styles.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.styles+xml"/></Types>`) },
      { name: "_rels/.rels", data: enc.encode(`<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="xl/workbook.xml"/></Relationships>`) },
      { name: "xl/workbook.xml", data: enc.encode(`<?xml version="1.0" encoding="UTF-8" standalone="yes"?><workbook xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main" xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships"><sheets><sheet name="ROPA" sheetId="1" r:id="rId1"/></sheets></workbook>`) },
      { name: "xl/_rels/workbook.xml.rels", data: enc.encode(`<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/worksheet" Target="worksheets/sheet1.xml"/><Relationship Id="rId2" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/styles" Target="styles.xml"/></Relationships>`) },
      { name: "xl/styles.xml", data: enc.encode(`<?xml version="1.0" encoding="UTF-8" standalone="yes"?><styleSheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main"><fonts count="2"><font><sz val="10"/><name val="Tahoma"/></font><font><b/><sz val="10"/><name val="Tahoma"/></font></fonts><fills count="3"><fill><patternFill patternType="none"/></fill><fill><patternFill patternType="gray125"/></fill><fill><patternFill patternType="solid"><fgColor rgb="FFDCE6F1"/><bgColor indexed="64"/></patternFill></fill></fills><borders count="2"><border><left/><right/><top/><bottom/><diagonal/></border><border><left style="thin"/><right style="thin"/><top style="thin"/><bottom style="thin"/><diagonal/></border></borders><cellStyleXfs count="1"><xf numFmtId="0" fontId="0" fillId="0" borderId="0"/></cellStyleXfs><cellXfs count="3"><xf numFmtId="0" fontId="0" fillId="0" borderId="0" xfId="0"/><xf numFmtId="0" fontId="1" fillId="2" borderId="1" xfId="0" applyFont="1" applyFill="1" applyBorder="1" applyAlignment="1"><alignment horizontal="center" vertical="center" wrapText="1"/></xf><xf numFmtId="0" fontId="0" fillId="0" borderId="1" xfId="0" applyBorder="1" applyAlignment="1"><alignment vertical="top" wrapText="1"/></xf></cellXfs></styleSheet>`) },
      { name: "xl/worksheets/sheet1.xml", data: enc.encode(sheet) }
    ];
    download(zipStore(files), "ROPA-" + new Date().toISOString().slice(0, 10) + ".xlsx");
  },
  exportJson() { download(new Blob([JSON.stringify(this.state.entries, null, 2)], { type: "application/json" }), "ROPA-backup-" + new Date().toISOString().slice(0, 10) + ".json"); },

  openEntry(id, mode) { this.setState({ currentId: id, view: "edit", mode, step: 0 }); window.scrollTo(0, 0); },
  addWizard() {
    const last = this.state.entries[this.state.entries.length - 1];
    const en = blankEntry(last ? last.division : "");
    const entries = this.state.entries.concat([en]);
    try { localStorage.setItem(LS_KEY, JSON.stringify(entries)); } catch (e) {}
    this.setState({ entries, currentId: en._id, view: "edit", mode: "wizard", step: 0, savedAt: new Date() });
    this.pushRemote(entries);
    this.queueBackupNudge();
  },
  duplicateEntry() {
    const cur = this.current(); if (!cur) return;
    const copy = Object.assign({}, JSON.parse(JSON.stringify(cur)), { _id: uid(), ref: (cur.ref || "") + "-copy" });
    const entries = this.state.entries.concat([copy]);
    try { localStorage.setItem(LS_KEY, JSON.stringify(entries)); } catch (e) {}
    this.setState({ entries, currentId: copy._id, savedAt: new Date() });
    this.pushRemote(entries);
    this.queueBackupNudge();
  },
  askConfirm(msg, action) { this.setState({ confirmMsg: msg, confirmAction: action }); },
  runConfirm() { const a = this.state.confirmAction; this.setState({ confirmMsg: null, confirmAction: null }); if (a) a(); },
  cancelConfirm() { this.setState({ confirmMsg: null, confirmAction: null }); },

  tab(active) { return "padding:7px 14px;border:none;border-radius:5px;cursor:pointer;font-size:13.5px;font-weight:" + (active ? "600" : "500") + ";background:" + (active ? "#fff" : "transparent") + ";color:" + (active ? "#143055" : "#b6c8da"); },
  tabLight(active) { return "padding:7px 14px;border:none;border-radius:5px;cursor:pointer;font-size:13.5px;font-weight:" + (active ? "600" : "500") + ";background:" + (active ? "#143055" : "transparent") + ";color:" + (active ? "#fff" : "#5b6775"); },

  render() {
    const st = this.state;
    const root = document.getElementById("root");
    root.innerHTML = this.html();
    root.onclick = e => this.delegate(e);
    root.oninput = e => this.delegateInput(e);
    root.onchange = e => this.delegateInput(e);
    if (this.focusKey) {
      const el = root.querySelector('[data-key="' + this.focusKey + '"]');
      if (el) { el.focus(); if (el.setSelectionRange && this.focusPos != null) { try { el.setSelectionRange(this.focusPos, this.focusPos); } catch (e) {} } }
      this.focusKey = null;
    }
  },

  delegateInput(e) {
    const t = e.target, key = t.getAttribute("data-key");
    if (!key) return;
    if (t.type === "checkbox") {
      const optIdx = +t.getAttribute("data-opt");
      const f = ALL_FIELDS.find(f => f.key === key);
      const cur = this.current(); const vals = Array.isArray(cur[key]) ? cur[key] : [];
      const opt = f.options[optIdx];
      this.focusKey = null;
      this.setField(key, vals.includes(opt) ? vals.filter(v => v !== opt) : vals.concat([opt]));
      return;
    }
    this.focusKey = key; this.focusPos = t.selectionStart;
    if (key === "__query") { this.setState({ query: t.value }); return; }
    this.setField(key, t.value);
  },

  delegate(e) {
    const el = e.target.closest("[data-act]");
    if (!el) return;
    const act = el.getAttribute("data-act");
    const arg = el.getAttribute("data-arg");
    switch (act) {
      case "goRegister": this.setState({ view: "register" }); break;
      case "goPrint": this.setState({ view: "print" }); break;
      case "setWizard": this.setState({ mode: "wizard" }); break;
      case "setForm": this.setState({ mode: "form" }); break;
      case "doPrint": window.print(); break;
      case "toggleGuide": this.setState({ guideOpen: !this.state.guideOpen }); break;
      case "stop": e.stopPropagation(); break;
      case "exportXlsx": this.exportXlsx(); break;
      case "exportJson": this.exportJson(); break;
      case "addWizard": this.addWizard(); break;
      case "duplicateEntry": this.duplicateEntry(); break;
      case "openWizard": this.openEntry(arg, "wizard"); break;
      case "openForm": this.openEntry(arg, "form"); break;
      case "remove": {
        const en = this.state.entries.find(x => x._id === arg);
        this.askConfirm("ลบกิจกรรม “" + (en.activity || en.ref) + "” ?", () => this.persist(this.state.entries.filter(x => x._id !== arg)));
        break;
      }
      case "cancelConfirm": this.cancelConfirm(); break;
      case "runConfirm": this.runConfirm(); break;
      case "dismissNudge": this.setState({ backupNudge: false }); break;
      case "backupNow": this.exportXlsx(); this.setState({ backupNudge: false }); break;
      case "gotoStep": this.setState({ step: +arg }); break;
      case "prevStep": this.setState({ step: Math.max(0, this.state.step - 1) }); break;
      case "nextStep": {
        const st2 = this.state;
        if (st2.step >= SECTIONS.length - 1) this.setState({ view: "register" });
        else this.setState({ step: st2.step + 1 });
        break;
      }
      case "useExample": {
        const f = ALL_FIELDS.find(f => f.key === arg);
        this.setField(arg, f.ex);
        break;
      }
      case "helperPick": {
        const [key, pickIdx] = arg.split("|");
        const f = ALL_FIELDS.find(f => f.key === key);
        const opt = f.options[+pickIdx];
        const cur = this.current(); const v = Array.isArray(cur[key]) ? cur[key] : [];
        if (!v.includes(opt)) this.setField(key, v.concat([opt]));
        break;
      }
    }
  },

      </div>
      <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px;margin-bottom:22px">
        <div style="background:#fff;border:1px solid #dfe3e8;border-radius:8px;padding:14px 16px"><div style="font-size:12.5px;color:#69737f;letter-spacing:.02em">กิจกรรมทั้งหมด</div><div style="font-size:26px;font-weight:600;margin-top:2px">${statTotal}</div></div>
        <div style="background:#fff;border:1px solid #dfe3e8;border-radius:8px;padding:14px 16px"><div style="font-size:12.5px;color:#69737f;letter-spacing:.02em">กรอกครบถ้วนแล้ว</div><div style="font-size:26px;font-weight:600;margin-top:2px;color:#146c43">${statDone}</div></div>
        <div style="background:#fff;border:1px solid #dfe3e8;border-radius:8px;padding:14px 16px"><div style="font-size:12.5px;color:#69737f;letter-spacing:.02em">ยังกรอกไม่ครบ</div><div style="font-size:26px;font-weight:600;margin-top:2px;color:#b45309">${statDraft}</div></div>
        <div style="background:#fff;border:1px solid #dfe3e8;border-radius:8px;padding:14px 16px"><div style="font-size:12.5px;color:#69737f;letter-spacing:.02em">มีข้อมูลอ่อนไหว</div><div style="font-size:26px;font-weight:600;margin-top:2px;color:#b42318">${statSens}</div></div>
      </div>
      <div style="background:#fff;border:1px solid #dfe3e8;border-radius:8px;overflow:hidden">
        <div style="display:flex;gap:10px;align-items:center;padding:12px 16px;border-bottom:1px solid #e8ebef;flex-wrap:wrap">
          <input type="text" data-key="__query" value="${esc(st.query)}" placeholder="ค้นหาจากชื่อกิจกรรม เลขอ้างอิง หรือหน่วยงาน" style="flex:1;min-width:240px;padding:9px 12px;border:1px solid #d3d9e0;border-radius:6px;background:#fbfcfd">
          <span style="font-size:13px;color:#69737f">แสดง ${rows.length} รายการ</span>
        </div>
        <div style="overflow-x:auto"><div style="min-width:960px">
          <div style="display:grid;grid-template-columns:110px 1.6fr 140px 160px 190px 220px;background:#f4f6f9;text-align:left">
            <div style="padding:10px 16px;font-weight:600;color:#4a5663;font-size:12.5px;letter-spacing:.04em;border-bottom:1px solid #e3e7ec;white-space:nowrap">เลขอ้างอิง</div>
            <div style="padding:10px 16px;font-weight:600;color:#4a5663;font-size:12.5px;letter-spacing:.04em;border-bottom:1px solid #e3e7ec">กิจกรรม</div>
            <div style="padding:10px 16px;font-weight:600;color:#4a5663;font-size:12.5px;letter-spacing:.04em;border-bottom:1px solid #e3e7ec;white-space:nowrap">หน่วยงาน</div>
            <div style="padding:10px 16px;font-weight:600;color:#4a5663;font-size:12.5px;letter-spacing:.04em;border-bottom:1px solid #e3e7ec;white-space:nowrap">เจ้าของข้อมูล</div>
            <div style="padding:10px 16px;font-weight:600;color:#4a5663;font-size:12.5px;letter-spacing:.04em;border-bottom:1px solid #e3e7ec">ความสมบูรณ์</div>
            <div style="padding:10px 16px;border-bottom:1px solid #e3e7ec"></div>
          </div>
          ${rowsHtml}
        </div></div>
        ${rows.length === 0 ? `<div style="padding:44px 20px;text-align:center;color:#69737f">
          <div style="font-size:15px;margin-bottom:12px">ยังไม่มีกิจกรรมในทะเบียน</div>
          <button type="button" data-act="addWizard" style="padding:10px 18px;border:1px solid #143055;background:#143055;color:#fff;border-radius:6px;font-weight:600;cursor:pointer">เริ่มกรอกกิจกรรมแรก</button>
        </div>` : ""}
      </div>
      <p style="margin:16px 2px 0;font-size:12.5px;color:#78828e;max-width:90ch;text-wrap:pretty">ข้อมูลถูกเก็บไว้ในเบราว์เซอร์ของเครื่องนี้เท่านั้น ไม่มีการส่งออกไปภายนอก — แนะนำให้กด “สำรองข้อมูล (.json)” เป็นระยะ และส่งออก Excel เพื่อรวมเข้าทะเบียนกลางของบริษัท</p>
    </main>`;
  },

  fieldHtml(f, cur) {
    const value = cur ? cur[f.key] : (f.type === "checks" ? [] : "");
    const empty = f.type === "checks" ? !(Array.isArray(value) && value.length) : isEmptyVal(value);
    const missing = empty;
    const inputStyle = "width:100%;padding:10px 12px;border-radius:6px;line-height:1.6;box-sizing:border-box;" + (missing ? "border:1px solid #e7b8ac;background:#fff8f5" : "border:1px solid #d3d9e0;background:#fbfcfd");
    const cellStyle = "padding:14px 12px;margin:0 -12px;border-bottom:1px solid #f2f4f7;border-radius:6px;" + (missing ? "background:#fffaf8" : "") + (f.wide || f.type === "textarea" || f.type === "checks" ? "grid-column:1/-1" : "");
    const ph = f.ex ? "เช่น " + String(f.ex).slice(0, 48) : "";
    const showWarn = f.key === "sensitiveData" && !!String(value || "").trim() && !/^(ไม่มี|-|n\/?a)$/i.test(String(value).trim());
    const hasExample = !!f.ex && f.type !== "checks" && f.type !== "select";

    let control = "";
    if (f.type === "text") control = `<input type="text" data-key="${f.key}" value="${esc(value)}" placeholder="${esc(ph)}" ${f.datalist ? `list="${f.datalist}"` : ""} style="${inputStyle}">`;
    else if (f.type === "textarea") control = `<textarea rows="4" data-key="${f.key}" placeholder="${esc(ph)}" style="${inputStyle}">${esc(value)}</textarea>`;
    else if (f.type === "select") control = `<select data-key="${f.key}" style="${inputStyle}">${(f.options || []).map(o => `<option value="${esc(o)}" ${o === value ? "selected" : ""}>${esc(o || "— เลือก —")}</option>`).join("")}</select>`;
    else if (f.type === "checks") {
      const vals = Array.isArray(value) ? value : [];
      const helper = f.helper || [];
      control = `<div style="${missing ? "border:1px dashed #e7b8ac;background:#fffaf8;border-radius:8px;padding:10px" : ""}display:flex;flex-direction:column;gap:6px">
        ${helper.length ? `<div style="background:#f0f4f9;border:1px solid #d7e2ee;border-radius:7px;padding:12px 14px;margin-bottom:6px">
          <div style="font-size:13.5px;font-weight:600;color:#143055;margin-bottom:8px">ไม่แน่ใจว่าต้องเลือกข้อไหน — ลองตอบว่าเหตุผลที่แผนกต้องใช้ข้อมูลนี้ตรงกับข้อใด</div>
          <div style="display:flex;flex-wrap:wrap;gap:7px">
            ${helper.map(h => `<button type="button" data-act="helperPick" data-arg="${f.key}|${h.pick}" style="text-align:left;padding:8px 12px;border:1px solid #c3d3e3;background:#fff;border-radius:6px;cursor:pointer;font-size:13px;max-width:100%">${esc(h.text)}</button>`).join("")}
          </div>
        </div>` : ""}
        ${f.options.map((opt, i) => {
          const checked = vals.includes(opt);
          return `<label style="display:flex;gap:10px;align-items:flex-start;padding:9px 12px;border:1px solid ${checked ? "#1f4e79" : "#e2e6ec"};background:${checked ? "#f4f8fc" : "#fff"};border-radius:6px;cursor:pointer">
            <input type="checkbox" data-key="${f.key}" data-opt="${i}" ${checked ? "checked" : ""} style="margin-top:3px;width:16px;height:16px;accent-color:#1f4e79;flex:none">
            <span style="font-size:14px;text-wrap:pretty">${esc(opt)}</span>
          </label>`;
        }).join("")}
      </div>`;
    }

    return `<div style="${cellStyle}">
      <div style="display:flex;align-items:baseline;gap:8px;margin-bottom:2px">
        <label style="font-size:15px;font-weight:600;color:#16202b;text-wrap:pretty">${esc(f.q)}</label>
        ${missing ? `<span style="font-size:11.5px;color:#b3400e;background:#fbe3d6;border-radius:3px;padding:1px 6px;white-space:nowrap">● ว่าง</span>` : ""}
        ${f.req ? `<span style="font-size:11.5px;color:#b45309;background:#fdf3e3;border-radius:3px;padding:1px 6px;white-space:nowrap">ต้องกรอก</span>` : ""}
        <span style="flex:1"></span>
        <span style="font-size:11px;color:#a3adb8;font-variant-numeric:tabular-nums;white-space:nowrap">ช่อง ${f.col}</span>
      </div>
      <div style="font-size:12.5px;color:#7a848f;margin-bottom:7px">${esc(f.label)}</div>
      ${f.help ? `<div style="font-size:13px;color:#5b6775;margin-bottom:8px;text-wrap:pretty">${esc(f.help)}</div>` : ""}
      ${control}
      ${showWarn ? `<div style="margin-top:9px;background:#fdeceb;border:1px solid #f3cdc9;border-radius:6px;padding:10px 13px;font-size:13px;color:#8a2019;text-wrap:pretty"><strong style="font-weight:600">กิจกรรมนี้มีข้อมูลอ่อนไหว</strong> — ต้องเลือกฐานตามมาตรา 26 ในหัวข้อ “ฐานทางกฎหมาย” และควรระบุมาตรการรักษาความปลอดภัยให้ชัดเจนกว่าปกติ</div>` : ""}
      ${hasExample ? `<div style="margin-top:7px;display:flex;gap:9px;align-items:flex-start;font-size:12.5px;color:#69737f">
        <button type="button" data-act="useExample" data-arg="${f.key}" style="flex:none;padding:4px 10px;border:1px dashed #b9c4d0;background:#fff;border-radius:5px;cursor:pointer;font-size:12.5px;color:#1f4e79">ใช้ตัวอย่างนี้</button>
        <span style="text-wrap:pretty">ตัวอย่าง: ${esc(f.ex)}</span>
      </div>` : ""}
    </div>`;
  },

  editHtml(cur) {
    const st = this.state;
    const pctColor = p => p >= 100 ? "#146c43" : p >= 50 ? "#1f4e79" : "#b45309";
    const pct = cur ? this.completeness(cur) : 0;
    const visible = st.mode === "wizard" ? [SECTIONS[Math.min(st.step, SECTIONS.length - 1)]] : SECTIONS;
    const sectionsHtml = visible.map(sec => `<section style="background:#fff;border:1px solid #dfe3e8;border-radius:8px">
      <div style="padding:16px 22px;border-bottom:1px solid #eef1f4;background:#fafbfc;border-radius:8px 8px 0 0">
        <div style="font-size:16.5px;font-weight:600;letter-spacing:-.005em">${esc(st.mode === "wizard" ? sec.title : sec.title.replace(/^ขั้นที่ \d+ · /, ""))}</div>
        <div style="font-size:12.5px;color:#7a848f;letter-spacing:.03em">${esc(sec.en)}</div>
        ${sec.note ? `<div style="margin-top:8px;font-size:13.5px;color:#4a5663;background:#f0f4f9;border-left:3px solid #9db6d0;padding:8px 12px;border-radius:0 4px 4px 0;text-wrap:pretty">${esc(sec.note)}</div>` : ""}
      </div>
      <div style="padding:8px 22px 22px;display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:4px 26px">
        ${sec.fields.map(f => this.fieldHtml(f, cur)).join("")}
      </div>
    </section>`).join("");

    const stepsHtml = st.mode === "wizard" ? `<div class="noprint" style="background:#fff;border-bottom:1px solid #dfe3e8;padding:0 24px 2px">
      <div style="max-width:1180px;margin:0 auto;display:flex;gap:6px;overflow-x:auto">
        ${SECTIONS.map((s, i) => `<button type="button" data-act="gotoStep" data-arg="${i}" style="padding:11px 14px;border:none;border-bottom:3px solid ${st.step === i ? "#143055" : "transparent"};background:transparent;cursor:pointer;white-space:nowrap;font-size:13.5px;font-weight:${st.step === i ? "600" : "500"};color:${st.step === i ? "#143055" : "#69737f"}"><span style="font-variant-numeric:tabular-nums;opacity:.6;margin-right:6px">${i + 1}</span>${esc(s.short)}</button>`).join("")}
      </div>
    </div>` : "";

    return `<main style="flex:1;display:flex;flex-direction:column;background:#eef1f5">
      <div class="noprint" style="background:#fff;border-bottom:1px solid #dfe3e8;padding:14px 24px">
        <div style="max-width:1180px;margin:0 auto;display:flex;align-items:center;gap:14px;flex-wrap:wrap">
          <button type="button" data-act="goRegister" style="padding:7px 13px;border:1px solid #c6ced8;background:#fff;border-radius:6px;cursor:pointer;font-size:13.5px">← กลับทะเบียน</button>
          <div style="flex:1;min-width:200px">
            <div style="font-size:17px;font-weight:600">${esc(cur ? (cur.ref ? cur.ref + " · " : "") + (cur.activity || "กิจกรรมใหม่") : "กิจกรรมใหม่")}</div>
            <div style="font-size:12.5px;color:#69737f">${esc(cur && cur.division ? "หน่วยงาน " + cur.division : "ยังไม่ได้ระบุหน่วยงาน")}</div>
          </div>
          <div style="display:flex;align-items:center;gap:10px">
            <div style="width:120px;height:7px;background:#e9edf2;border-radius:4px;overflow:hidden"><div style="height:100%;background:${pctColor(pct)};width:${pct}%"></div></div>
            <span style="font-size:13px;color:#5b6775;font-variant-numeric:tabular-nums">สมบูรณ์ ${pct}%</span>
          </div>
          <div style="display:flex;gap:2px;background:#eef1f5;border-radius:7px;padding:3px">
            <button type="button" data-act="setWizard" style="${this.tabLight(st.mode === "wizard")}">ทีละขั้น</button>
            <button type="button" data-act="setForm" style="${this.tabLight(st.mode === "form")}">ฟอร์มเต็ม</button>
          </div>
        </div>
      </div>
      ${stepsHtml}
      <div style="flex:1;padding:24px 24px 90px">
        <div style="max-width:1180px;margin:0 auto;display:flex;flex-direction:column;gap:20px">
          ${sectionsHtml}
          ${st.mode === "wizard" ? `<div style="display:flex;gap:10px;align-items:center;flex-wrap:wrap">
            <button type="button" data-act="prevStep" style="padding:11px 20px;border:1px solid #c6ced8;background:#fff;border-radius:6px;cursor:pointer;font-weight:500">← ขั้นก่อนหน้า</button>
            <button type="button" data-act="nextStep" style="padding:11px 22px;border:1px solid #143055;background:#143055;color:#fff;border-radius:6px;cursor:pointer;font-weight:600">${st.step >= SECTIONS.length - 1 ? "เสร็จสิ้น — กลับทะเบียน" : "ขั้นถัดไป →"}</button>
            <span style="font-size:13px;color:#69737f">ขั้นที่ ${st.step + 1} จาก ${SECTIONS.length} · ข้ามขั้นไหนก่อนก็ได้ ระบบเก็บให้ทุกครั้งที่พิมพ์</span>
          </div>` : ""}
        </div>
      </div>
      <div class="noprint" style="position:sticky;bottom:0;background:#fff;border-top:1px solid #dfe3e8;padding:12px 24px;box-shadow:0 -2px 10px rgba(20,48,85,.06)">
        <div style="max-width:1180px;margin:0 auto;display:flex;align-items:center;gap:12px;flex-wrap:wrap">
          <span style="font-size:13px;color:#69737f;flex:1">${esc(this.saveLabel())} · ไม่ต้องกดบันทึก ระบบเก็บให้อัตโนมัติ</span>
          <button type="button" data-act="duplicateEntry" style="padding:9px 15px;border:1px solid #c6ced8;background:#fff;border-radius:6px;cursor:pointer;font-size:13.5px">ทำสำเนากิจกรรมนี้</button>
          <button type="button" data-act="goPrint" style="padding:9px 15px;border:1px solid #c6ced8;background:#fff;border-radius:6px;cursor:pointer;font-size:13.5px">ดูโหมดตรวจทาน</button>
          <button type="button" data-act="goRegister" style="padding:9px 18px;border:1px solid #143055;background:#143055;color:#fff;border-radius:6px;cursor:pointer;font-weight:600;font-size:13.5px">เสร็จสิ้น</button>
        </div>
      </div>
    </main>`;
  },

  printHtml() {
    const st = this.state;
    const entriesHtml = st.entries.map(en => {
      const pct = this.completeness(en);
      const sectionsHtml = SECTIONS.map(sec => `<div style="margin-bottom:16px">
        <div style="font-size:14px;font-weight:600;color:#143055;margin-bottom:6px">${esc(sec.title.replace(/^ขั้นที่ \d+ · /, "") + " · " + sec.en)}</div>
        <div style="font-size:13.5px">
          ${sec.fields.map(f => `<div style="display:grid;grid-template-columns:34% 1fr;border-bottom:1px solid #edf0f3">
            <div style="padding:6px 10px 6px 0;color:#4a5663">${esc(f.label)}</div>
            <div style="padding:6px 0;white-space:pre-line;text-wrap:pretty">${esc(this.cellValue(en, f.key) || "—")}</div>
          </div>`).join("")}
        </div>
      </div>`).join("");
      return `<article style="background:#fff;border:1px solid #d7dce3;padding:34px 40px;break-inside:avoid">
        <div style="border-bottom:2px solid #143055;padding-bottom:10px;margin-bottom:18px">
          <div style="font-size:11.5px;letter-spacing:.08em;color:#69737f;text-transform:uppercase">Record of Processing Activities</div>
          <div style="font-size:19px;font-weight:600;margin-top:3px">${esc(en.ref || "—")} · ${esc(en.activity || "(ยังไม่ระบุชื่อกิจกรรม)")}</div>
          <div style="font-size:13px;color:#4a5663">หน่วยงาน ${esc(en.division || "—")} · ความสมบูรณ์ ${pct}%</div>
        </div>
        ${sectionsHtml}
      </article>`;
    }).join("");
    return `<main style="flex:1;padding:26px 20px 70px;background:#e7eaef">
      <div class="noprint" style="max-width:860px;margin:0 auto 18px;display:flex;gap:10px;align-items:center;flex-wrap:wrap">
        <div style="flex:1;min-width:200px;font-size:13.5px;color:#4a5663">โหมดตรวจทาน — จัดหน้าสำหรับพิมพ์หรือส่งให้ผู้ประสานงาน PDPA ตรวจสอบ</div>
        <button type="button" data-act="doPrint" style="padding:9px 18px;border:1px solid #143055;background:#143055;color:#fff;border-radius:6px;cursor:pointer;font-weight:600;font-size:13.5px">พิมพ์ / บันทึกเป็น PDF</button>
      </div>
      <div style="max-width:860px;margin:0 auto;display:flex;flex-direction:column;gap:22px;font-family:'Sarabun',serif">${entriesHtml}</div>
    </main>`;
  },

  nudgeHtml() {
    return `<div class="noprint" style="position:fixed;bottom:22px;right:22px;z-index:45;background:#16202b;color:#fff;border-radius:8px;padding:14px 16px;box-shadow:0 10px 28px rgba(0,0,0,.25);width:min(320px,88vw);display:flex;flex-direction:column;gap:10px">
      <div style="font-size:13.5px;line-height:1.5;text-wrap:pretty">บันทึกไว้ในเบราว์เซอร์นี้แล้ว — ดาวน์โหลดไฟล์สำรองไว้กันข้อมูลหายไหม?</div>
      <div style="display:flex;justify-content:flex-end;gap:8px">
        <button type="button" data-act="dismissNudge" style="padding:6px 12px;border:1px solid #3a4753;background:transparent;color:#cfd6dd;border-radius:6px;cursor:pointer;font-size:12.5px">ไว้ทีหลัง</button>
        <button type="button" data-act="backupNow" style="padding:6px 14px;border:none;background:#fff;color:#16202b;border-radius:6px;cursor:pointer;font-weight:600;font-size:12.5px">ดาวน์โหลดเลย</button>
      </div>
    </div>`;
  },

  confirmHtml() {
    return `<div class="noprint" style="position:fixed;inset:0;background:rgba(10,20,35,.45);z-index:50;display:flex;align-items:center;justify-content:center">
      <div style="background:#fff;border-radius:8px;padding:22px 24px;width:min(380px,88vw);box-shadow:0 12px 32px rgba(0,0,0,.2)">
        <div style="font-size:15.5px;font-weight:600;margin-bottom:14px;text-wrap:pretty">${esc(this.state.confirmMsg)}</div>
        <div style="display:flex;justify-content:flex-end;gap:8px">
          <button type="button" data-act="cancelConfirm" style="padding:8px 16px;border:1px solid #c6ced8;background:#fff;border-radius:6px;cursor:pointer;font-size:13.5px">ยกเลิก</button>
          <button type="button" data-act="runConfirm" style="padding:8px 16px;border:1px solid #b42318;background:#b42318;color:#fff;border-radius:6px;cursor:pointer;font-weight:600;font-size:13.5px">ยืนยันลบ</button>
        </div>
      </div>
    </div>`;
  }
};

App.init();
</script>
</body>
</html>
